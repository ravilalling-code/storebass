name: Final admin repair
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/final-admin-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified patch
        run: |
          echo '' | base64 -d > /tmp/admin.patch
          git apply --check /tmp/admin.patch
          git apply /tmp/admin.patch
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git checkout -- next-env.d.ts || true
          git config user.name storebass-bot
          git config user.email actions@users.noreply.github.com
          git add src/app/admin/page.tsx
          git commit -m 'fix(admin): repair dashboard JSX and itinerary action'
          git push origin HEAD:main
