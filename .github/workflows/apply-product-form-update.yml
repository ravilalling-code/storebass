name: Apply product form update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-product-form-update.yml'
      - '.github/scripts/update-product-form.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply form update
        run: python3 .github/scripts/update-product-form.py
      - name: Verify build
        run: npm ci && npm run build
      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/page.tsx
          git diff --cached --quiet || git commit -m "fix(admin): unify normal price offers and multi-image product form"
          git push
