name: Repair StoreBass admin JSX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-admin-jsx.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply exact build-verified repair
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/app/admin/page.tsx')
          s = path.read_text()
          orphan = '''                  <div className="text-2xl font-black text-white">
                    {shippingGuides.length} Guías
                  </div>
                  <div className="text-xs text-blue-300 font-bold mt-2 flex items-center gap-1">
                    <span>✈️ Miami Hub ➔ Lima Callao</span>
                  </div>
                </div>
'''
          if orphan not in s:
              raise SystemExit('Orphan shipping fragment not found')
          s = s.replace(orphan, '', 1)
          s = s.replace('Administrar todas las guías', 'Editar en Ajustes & Viajes', 1)
          path.write_text(s)

      - name: Verify production build
        run: npm run build

      - name: Commit repair
        run: |
          git config user.name "storebass-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -- next-env.d.ts || true
          git add src/app/admin/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(admin): repair dashboard JSX and itinerary action"
          git push origin main
