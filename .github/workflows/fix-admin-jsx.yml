name: Repair StoreBass admin JSX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-admin-jsx.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repair malformed dashboard fragment
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/app/admin/page.tsx')
          s = path.read_text()
          broken = '''                </div>
                  <div className="text-2xl font-black text-white">
                    {shippingGuides.length} Guías
                  </div>
                  <div className="text-xs text-blue-300 font-bold mt-2 flex items-center gap-1">
                    <span>✈️ Miami Hub ➔ Lima Callao</span>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">'''
          fixed = '''                </div>

                <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">'''
          if broken not in s:
              raise SystemExit('Expected malformed dashboard fragment not found')
          s = s.replace(broken, fixed, 1)
          path.write_text(s)

      - name: Verify cleanup and build
        run: |
          ! grep -q "shippingGuides" src/app/admin/page.tsx
          npm run build

      - name: Commit repair
        run: |
          git config user.name "storebass-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/admin/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(admin): repair dashboard JSX after shipping cleanup"
          git push origin main
