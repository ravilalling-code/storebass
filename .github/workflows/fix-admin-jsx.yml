name: Repair StoreBass admin JSX

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-admin-jsx.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply verified JSX repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app/admin/page.tsx')
          s = p.read_text()
          orphan = '''                  <div className="text-2xl font-black text-white">
                    {shippingGuides.length} Guías
                  </div>
                  <div className="text-xs text-blue-300 font-bold mt-2 flex items-center gap-1">
                    <span>✈️ Miami Hub ➔ Lima Callao</span>
                  </div>
                </div>
'''
          if orphan not in s:
              raise SystemExit('Expected orphan shipping fragment not found')
          s = s.replace(orphan, '', 1)
          marker = '''                  <div className="flex items-center gap-1.5 text-xs text-emerald-400 font-bold mt-2">
                    <span className="material-symbols-outlined text-sm">trending_up</span>
                    <span>Pedidos sincronizados en tiempo real</span>
                  </div>
                <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">'''
          fixed = '''                  <div className="flex items-center gap-1.5 text-xs text-emerald-400 font-bold mt-2">
                    <span className="material-symbols-outlined text-sm">trending_up</span>
                    <span>Pedidos sincronizados en tiempo real</span>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">'''
          if marker not in s:
              raise SystemExit('Expected missing KPI closing div marker not found')
          s = s.replace(marker, fixed, 1)
          s = s.replace('Administrar todas las guías', 'Editar en Ajustes & Viajes', 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit verified repair
        run: |
          git config user.name "storebass-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -- next-env.d.ts || true
          git add src/app/admin/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(admin): repair dashboard JSX after cleanup"
          git push origin main
