name: Build Android APK - StoreBass Monitor

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK with Gradle 8.5
        run: |
          cd apk-android
          gradle assembleDebug --stacktrace

      - name: Prepare APK File
        run: |
          mkdir -p dist-apk
          find apk-android/app/build/outputs/apk -name "*.apk" -exec cp {} dist-apk/storebass-monitor.apk \;
          echo "APK generated:"
          ls -lh dist-apk/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: storebass-monitor-apk
          path: dist-apk/storebass-monitor.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "StoreBass Monitor App v1.0.0 (APK)"
          body: "Descarga directa de StoreBass Monitor de Pedidos para Android."
          files: dist-apk/storebass-monitor.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
